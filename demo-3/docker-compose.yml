services:
  producer:
    build: ./producer
    ports:
      - "3003:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  consumer:
    build: ./consumer
    ports:
      - "8003:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
